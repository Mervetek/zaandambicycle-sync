name: Zaandam stok senkron

on:
  schedule:
    - cron: '0 16,17,18,19,20 * * *'   # PIK: NL 18-22, saat basi
    - cron: '0 6,9,12,14 * * *'         # gunduz: NL 08,11,14,16
    - cron: '0 2 * * *'                 # gece: NL ~04
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: sync.env olustur (Secret'tan)
        shell: bash
        run: |
          printf '%s' "${{ secrets.SYNC_ENV }}" > sync.env
          sed -i 's/\r$//' sync.env               # CRLF -> LF (secret bozuk satir sonuyla yapistirilmis olabilir)
          echo "sync.env satir sayisi: $(wc -l < sync.env)"
          # Zorunlu anahtarlar var mi? (deger sizdirmadan sadece varlik kontrolu)
          for k in KRUITBOSCH_USERNAME KRUITBOSCH_PASSWORD KRUITBOSCH_CUSTOMER ACCELL_USERNAME ACCELL_PASSWORD SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET SHOPIFY_SHOP SHOPIFY_LOCATION; do
            grep -q "^$k=" sync.env || { echo "HATA: secret'ta $k eksik"; exit 1; }
          done
      - name: daily_sync calistir
        shell: pwsh
        run: ./daily_sync.ps1
      - name: durum dosyalarini geri commit et
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bike_battery_links.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "durum degismedi"
          else
            git commit -m "auto: senkron durumu $(date -u +%FT%TZ)"
            # remote ilerlemis olabilir (elle push'lar / diger kosular) -> rebase + retry.
            # Push yine olmazsa KRITIK DEGIL: sync zaten basarili, bike_battery_links.csv sonraki kosuda yine turetilir.
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main; then
                if git push; then pushed=1; break; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "push denemesi $i basarisiz, 5sn bekle..."; sleep 5
            done
            if [ "$pushed" != "1" ]; then echo "UYARI: durum dosyasi push edilemedi (sync BASARILI - kritik degil)"; fi
          fi
