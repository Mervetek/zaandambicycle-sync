name: Zaandam stok senkron

on:
  schedule:
    - cron: '0 16,17,18,19,20 * * *'   # PIK: NL 18-22, saat basi
    - cron: '0 6,9,12,14 * * *'         # gunduz: NL 08,11,14,16
    - cron: '0 2 * * *'                 # gece: NL ~04
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: sync.env olustur (Secret'tan)
        shell: bash
        run: printf '%s' "${{ secrets.SYNC_ENV }}" > sync.env
      - name: daily_sync calistir
        shell: pwsh
        run: ./daily_sync.ps1
      - name: durum dosyalarini geri commit et
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bike_battery_links.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "durum degismedi"
          else
            git commit -m "auto: senkron durumu $(date -u +%FT%TZ)"
            git push
          fi
