name: Zaandam stok senkron

on:
  schedule:
    - cron: '0 16,17,18,19,20 * * *'   # PIK: NL 18-22, saat basi
    - cron: '0 6,9,12,14 * * *'         # gunduz: NL 08,11,14,16
    - cron: '0 2 * * *'                 # gece: NL ~04
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: sync.env olustur (Secret'tan)
        shell: bash
        run: |
          printf '%s' "${{ secrets.SYNC_ENV }}" > sync.env
          sed -i 's/\r$//' sync.env               # CRLF -> LF (secret bozuk satir sonuyla yapistirilmis olabilir)
          echo "sync.env satir sayisi: $(wc -l < sync.env)"
          # Zorunlu anahtarlar var mi? (deger sizdirmadan sadece varlik kontrolu)
          for k in KRUITBOSCH_USERNAME KRUITBOSCH_PASSWORD KRUITBOSCH_CUSTOMER ACCELL_USERNAME ACCELL_PASSWORD SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET SHOPIFY_SHOP SHOPIFY_LOCATION; do
            grep -q "^$k=" sync.env || { echo "HATA: secret'ta $k eksik"; exit 1; }
          done
      - name: teshis (gecici - sorun bulununca silinecek)
        shell: bash
        run: |
          shop=$(grep '^SHOPIFY_SHOP=' sync.env | cut -d= -f2- | tr -d '\r')
          echo "SHOPIFY_SHOP degeri: [$shop]"
          echo "proxy env (kucuk): http_proxy=[${http_proxy:-}] https_proxy=[${https_proxy:-}] all_proxy=[${all_proxy:-}] no_proxy=[${no_proxy:-}]"
          echo "proxy env (buyuk): HTTP_PROXY=[${HTTP_PROXY:-}] HTTPS_PROXY=[${HTTPS_PROXY:-}] ALL_PROXY=[${ALL_PROXY:-}] NO_PROXY=[${NO_PROXY:-}]"
          echo "--- DNS cozumleme ---"
          getent hosts "$shop" || echo "DNS COZULEMEDI: [$shop]"
          echo "--- curl Shopify ---"
          curl -sS -m 20 -o /dev/null -w "shop -> HTTP %{http_code}\n" "https://$shop/admin/api/2024-10/shop.json" || echo "curl Shopify BASARISIZ"
          echo "--- curl Kruitbosch (kontrol) ---"
          curl -sS -m 20 -o /dev/null -w "kb -> HTTP %{http_code}\n" "https://webservice.kruitbosch.nl/" || echo "curl KB BASARISIZ"
      - name: daily_sync calistir
        shell: pwsh
        run: ./daily_sync.ps1
      - name: durum dosyalarini geri commit et
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bike_battery_links.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "durum degismedi"
          else
            git commit -m "auto: senkron durumu $(date -u +%FT%TZ)"
            git push
          fi
